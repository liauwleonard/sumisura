name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Allow GITHUB_TOKEN to publish to Pages.
permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time; don't cancel a run that is mid-publish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Vite inlines VITE_* values at build time, so they must be present here rather than at
      # runtime. Both are safe to expose — see .env.example. If the secrets are unset the build
      # still succeeds and the app runs local-only, which is the intended fallback.
      - run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}

      # Pages must already exist with its source set to "GitHub Actions"
      # (Settings -> Pages -> Source). Deploying from a branch will NOT work: this workflow
      # publishes a built artifact, while a branch source would serve the raw repo.
      #
      # `enablement: true` was tried here so the workflow could create the site itself, but the
      # workflow token is not permitted to do that on this repo:
      #   "Create Pages site failed. Error: Resource not accessible by integration"
      # So the site is enabled once, by hand, and this step just reads its config.
      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
